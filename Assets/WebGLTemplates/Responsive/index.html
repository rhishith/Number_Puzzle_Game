<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #0b1326;
        user-select: none;
        -webkit-user-select: none;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background-color: #0b1326;
        display: block;
      }
      #loading-cover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #0b1326;
        z-index: 10;
      }
      #loading-title {
        color: #ddb7ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 36px;
        font-weight: bold;
        margin-bottom: 24px;
        letter-spacing: 2px;
      }
      #progress-bar-container {
        width: 240px;
        height: 10px;
        background-color: #171f33;
        border-radius: 5px;
        overflow: hidden;
      }
      #progress-bar-fill {
        width: 0%;
        height: 100%;
        background-color: #b76dff;
        border-radius: 5px;
        transition: width 0.2s ease;
      }
      #fullscreen-btn {
        position: absolute;
        bottom: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
        cursor: pointer;
        opacity: 0.6;
        transition: opacity 0.2s;
        z-index: 5;
        background: rgba(23, 31, 51, 0.7);
        border: 1px solid rgba(221, 183, 255, 0.3);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #fullscreen-btn:hover {
        opacity: 1;
        background: rgba(23, 31, 51, 0.95);
      }
      #fullscreen-btn svg {
        width: 18px;
        height: 18px;
        fill: #ddb7ff;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading-cover">
        <div id="loading-title">{{{ PRODUCT_NAME }}}</div>
        <div id="progress-bar-container">
          <div id="progress-bar-fill"></div>
        </div>
      </div>
      <div id="fullscreen-btn" title="Toggle Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarFill = document.querySelector("#progress-bar-fill");
      const fullscreenBtn = document.querySelector("#fullscreen-btn");

      const config = {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      };

      createUnityInstance(canvas, config, (progress) => {
        progressBarFill.style.width = (100 * progress) + "%";
      }).then((unityInstance) => {
        loadingCover.style.display = "none";
        fullscreenBtn.onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
